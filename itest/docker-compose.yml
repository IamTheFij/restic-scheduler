---
services:
  mariadb:
    image: mariadb:13
    environment:
      MYSQL_ROOT_PASSWORD: shhh
      MYSQL_DATABASE: main

  postgres:
    image: postgres:14
    environment:
      POSTGRES_PASSWORD: shhh
      POSTGRES_DB: main

  bootstrap:
    image: restic-scheduler-itest
    entrypoint: /itest/bootstrap-tests.sh
    environment:
      MYSQL_HOST: mariadb
      MYSQL_USER: root
      MYSQL_PWD: shhh
      PGSQL_HOST: postgres
      PGSQL_USER: postgres
      PGSQL_PASS: shhh
    volumes:
      - ./data:/data

  db-wait:
    image: restic-scheduler-itest
    entrypoint: /itest/db-wait.sh
    environment:
      MYSQL_HOST: mariadb
      MYSQL_USER: root
      MYSQL_PWD: shhh
      PGSQL_HOST: postgres
      PGSQL_USER: postgres
      PGSQL_PASS: shhh

  main:
    image: restic-scheduler-itest
    command:
      - /test-backup.hcl
    environment:
      MYSQL_HOST: mariadb
      MYSQL_USER: root
      MYSQL_PWD: shhh
      PGSQL_HOST: postgres
      PGSQL_USER: postgres
      PGSQL_PASS: shhh
      GOCOVERDIR: /coverage
    volumes:
      - ./repo:/repo
      - ./data:/data
      - ./test-backup.hcl:/test-backup.hcl
      - ../coverage:/coverage

  validate:
    image: restic-scheduler-itest
    entrypoint: /itest/validate-tests.sh
    environment:
      MYSQL_HOST: mariadb
      MYSQL_USER: root
      MYSQL_PWD: shhh
      PGSQL_HOST: postgres
      PGSQL_USER: postgres
      PGSQL_PASS: shhh
    volumes:
      - ./data:/data
